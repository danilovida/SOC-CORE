name: SOC CORE Traffic Analytics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify traffic token configured
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure repository secret TRAFFIC_TOKEN with a fine-grained PAT (Metadata: read; Administration: read) for this repository."
            exit 1
          fi
      - name: Collect traffic and update dashboard
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python analytics/collect.py
      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/traffic.json analytics/README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update SOC CORE traffic analytics"
            git push
          fi
